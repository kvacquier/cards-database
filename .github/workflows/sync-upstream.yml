name: Sync develop with upstream master

on:
  # Daily (~05:17 Paris). The check takes ~15 s and is free (public repo); the server is only
  # rebuilt when upstream actually changed. Run it by hand from the Actions tab if needed.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      deploy:
        description: Redeploy the server even if it already runs the latest develop
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Merge tcgdex/cards-database master into develop
    outputs:
      sha: ${{ steps.merge.outputs.sha }}
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - name: Checkout develop
        uses: actions/checkout@v6
        with:
          ref: develop
          fetch-depth: 0

      - name: Merge upstream master
        id: merge
        run: |
          git config user.name "kvacquier"
          git config user.email "kvacquier@gmail.com"
          git remote add upstream https://github.com/tcgdex/cards-database.git
          git fetch upstream master
          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "develop already contains upstream/master"
          else
            git merge --no-edit upstream/master -m "Merge upstream master into develop"
            git push origin develop
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The tag server-deployed points to the last develop commit deployed successfully, so a
      # deploy that failed or was interrupted is retried on the next run instead of being skipped.
      - name: Check whether the server runs this commit
        id: check
        env:
          WANT: ${{ steps.merge.outputs.sha }}
          FORCE: ${{ inputs.deploy && 'true' || 'false' }}
        run: |
          have=$(git ls-remote origin refs/tags/server-deployed | cut -f1)
          if [ "$have" = "$WANT" ] && [ "$FORCE" != true ]; then
            echo "The server already runs $WANT"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "The server runs ${have:-an unknown commit}, deploying $WANT"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: Rebuild and restart the server
    needs: sync
    if: needs.sync.outputs.deploy == 'true'
    permissions:
      contents: write
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.PROXMOX_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PROXMOX_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      # The deploy key has a forced command on the Proxmox host: whatever is sent, the host runs its
      # own pull and compile, so the runner stays connected until it ends (~7 min). Killing the
      # connection kills the compile, hence the long timeout.
      - name: Pull, compile and reboot CT 102
        env:
          TARGET: ${{ secrets.PROXMOX_USER }}@${{ secrets.PROXMOX_HOST }}
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 "$TARGET" \
            "pct exec 102 -- bash -lc 'set -e; cd /root/cards-database && git pull && cd server && bun run compile' && pct reboot 102"

      - name: Record the deployed commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.sync.outputs.sha }}
        run: |
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/server-deployed" -f sha="$SHA" -F force=true \
            || gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/tags/server-deployed -f sha="$SHA"
