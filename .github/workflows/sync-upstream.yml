name: Sync develop with upstream master

on:
  # Daily (~05:17 Paris). The check takes ~15 s and is free (public repo); the server is only
  # rebuilt when upstream actually changed. Run it by hand from the Actions tab if needed.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      deploy:
        description: Redeploy the server even if it already runs the latest develop
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Merge tcgdex/cards-database master into develop
    outputs:
      sha: ${{ steps.merge.outputs.sha }}
    steps:
      - name: Checkout develop
        uses: actions/checkout@v6
        with:
          ref: develop
          fetch-depth: 0

      - name: Merge upstream master
        id: merge
        run: |
          git config user.name "kvacquier"
          git config user.email "kvacquier@gmail.com"
          git remote add upstream https://github.com/tcgdex/cards-database.git
          git fetch upstream master
          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "develop already contains upstream/master"
          else
            git merge --no-edit upstream/master -m "Merge upstream master into develop"
            git push origin develop
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Runs every time: the host keeps the last develop commit it compiled successfully, so a deploy
  # that failed or was interrupted is retried on the next run instead of being skipped.
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: Rebuild and restart the server
    needs: sync
    permissions: {}
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.PROXMOX_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PROXMOX_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      # The compile (~7 min) runs in a transient systemd unit on the Proxmox host, outside the SSH
      # session, so the runner disconnects right away without killing it. On the host:
      #   tail -f /var/log/cards-deploy.log    (or journalctl -u cards-deploy)
      # No reboot, and the commit is not recorded, if the compile fails.
      - name: Start pull, compile and reboot of CT 102 if it is not on develop yet
        env:
          TARGET: ${{ secrets.PROXMOX_USER }}@${{ secrets.PROXMOX_HOST }}
          WANT: ${{ needs.sync.outputs.sha }}
          FORCE: ${{ inputs.deploy && 'true' || 'false' }}
        run: |
          cat > deploy.sh <<'EOF'
          set -euo pipefail
          want="$1" force="$2"
          echo "cards-deploy: connected to $(hostname)"
          have=$(cat /var/lib/cards-deploy/deployed-sha 2>/dev/null || true)
          if systemctl is-active --quiet cards-deploy; then
            echo "A deploy is already running, see /var/log/cards-deploy.log"
            exit 0
          fi
          if [ "$have" = "$want" ] && [ "$force" != true ]; then
            echo "The server already runs $want"
            exit 0
          fi
          echo "The server runs ${have:-an unknown commit}, deploying $want"
          systemd-run --unit=cards-deploy --collect --quiet bash -c '
            exec > /var/log/cards-deploy.log 2>&1
            set -e
            date
            pct exec 102 -- bash -lc "set -e; cd /root/cards-database && git pull && cd server && bun run compile"
            sha=$(pct exec 102 -- git -C /root/cards-database rev-parse HEAD)
            mkdir -p /var/lib/cards-deploy
            echo "$sha" > /var/lib/cards-deploy/deployed-sha
            pct reboot 102
            echo "deployed $sha"
          '
          echo "Started; follow it on the host with: tail -f /var/log/cards-deploy.log"
          EOF
          status=0
          timeout 60 ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o BatchMode=yes -o ConnectTimeout=20 "$TARGET" bash -s -- "$WANT" "$FORCE" < deploy.sh > out.txt 2>&1 || status=$?
          cat out.txt
          if ! grep -q '^cards-deploy: connected' out.txt; then
            echo "::error::The host did not run the script sent by this step. Check for a forced command on the deploy key (command=\"...\" in /root/.ssh/authorized_keys) or a ForceCommand in /etc/ssh/sshd_config."
            exit 1
          fi
          exit "$status"
